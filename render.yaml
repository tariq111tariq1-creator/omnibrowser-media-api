services:
  - type: web
    name: omnibrowser-media-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MIN_INTERVAL_SECONDS
        value: "1.0"
